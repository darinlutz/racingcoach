# Weekly dependency updates as pull requests, each checked by CI (ci.yml) before it can be merged. Minor and patch
# updates are grouped into one pull request per area; a major update gets its own, as it may need code changes.
# Security updates (Dependabot alerts, turned on in the repository's settings) come as soon as an advisory is out.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      website:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /bot
    schedule: { interval: weekly, day: monday }
    groups:
      discord-bot:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /collector
    schedule: { interval: weekly, day: monday }
    groups:
      collector:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        update-types: [minor, patch]
