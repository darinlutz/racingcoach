# Builds the RacingCoach Collector (collector/RacingCoach.Collector) and publishes it as a GitHub release
# when a collector-v* tag is pushed, e.g.
#   git tag collector-v1.1.0
#   git push origin collector-v1.1.0
# The Account page's Download button links to the latest release's RacingCoach.Collector.Setup.exe (the
# installer, collector/installer), and the collector itself checks this repo's latest release for new
# versions (UpdateCheck.cs): an installed one updates with the installer, a plain exe with the exe.
name: Collector release

on:
  push:
    tags:
      - 'collector-v*'

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring('collector-v'.Length)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag ${{ github.ref_name }} must look like collector-v1.2.3" }
          "version=$version" >> $env:GITHUB_OUTPUT

      # One self-contained .exe with .NET inside, so the sim PC needs nothing installed. Compressed: about
      # 62 MB instead of 134 MB (WPF is large), for a moment longer at startup.
      - name: Publish
        working-directory: collector/RacingCoach.Collector
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # Installs the exe in Program Files with shortcuts and an uninstaller. Inno Setup comes with GitHub's
      # Windows runners; installed here if an image ever drops it.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Couldn't install Inno Setup" }
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DPublishDir=$pwd\collector\RacingCoach.Collector\publish" `
            "/O$pwd\collector\RacingCoach.Collector\publish" `
            collector/installer/RacingCoach.Collector.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          Download **RacingCoach.Collector.Setup.exe** below and run it on the PC you race on. It installs the collector in Program Files, with a Start menu shortcut. **RacingCoach.Collector.exe** is the collector on its own, to run without installing.

          Windows may say it protected your PC because the app isn't signed: click **More info**, then **Run anyway**.
          "@
          gh release create '${{ github.ref_name }}' `
            'collector/RacingCoach.Collector/publish/RacingCoach.Collector.Setup.exe' `
            'collector/RacingCoach.Collector/publish/RacingCoach.Collector.exe' `
            --title 'RacingCoach Collector ${{ steps.version.outputs.version }}' --notes $notes --latest
